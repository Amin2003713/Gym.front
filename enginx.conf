server {
    listen 80;

    # Compress text responses at the edge; Next also compresses, but this covers proxied static
    # files and responses where the upstream did not negotiate gzip.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/woff2;

    # Next fingerprints these file names, so they can be cached for a year.
    location /_next/static/ {
        proxy_pass http://next.js:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public images and fonts keep stable URLs.
    location ~* \.(?:woff2?|avif|webp|png|jpe?g|gif|svg|ico)$ {
        proxy_pass http://next.js:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    }

    location / {
        proxy_pass http://next.js:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
