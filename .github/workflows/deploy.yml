name: Deploy carpet (DEV)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: { }

permissions:
  contents: read

concurrency:
  group: next-carpet-queue
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate remote directory
        env:
          REMOTE_DIR: "/gym/front"
        run: |
          set -euo pipefail

          case "$REMOTE_DIR" in
            ""|"/"|"/root"|"/home"|"/etc"|"/usr"|"/var"|"/var/"|"/opt"|"/srv")
              echo "Unsafe REMOTE_DIR: $REMOTE_DIR"
              exit 1
              ;;
          esac

          echo "REMOTE_DIR is safe: $REMOTE_DIR"


      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync


      # -----------------------
      # SAFE SYNC (DEV)
      # -----------------------
      - name: Sync repository (DEV)
        env:
          SSH_HOST: "85.198.52.187"
          SSH_USER: "root"
          SSH_PASSWORD: "Amin#7Xv!92QpL4"
          SSH_PORT: "22"
          REMOTE_DIR: "/gym/front"
        run: |
          set -euo pipefail

          sshpass -p "$SSH_PASSWORD" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" "
              set -e
              mkdir -p '${REMOTE_DIR%/}'
              find '${REMOTE_DIR%/}' -mindepth 1 -delete
            "

          sshpass -p "$SSH_PASSWORD" rsync -az \
            --delete \
            --exclude='.git' \
            --exclude='.github' \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no" \
            ./ "$SSH_USER@$SSH_HOST:${REMOTE_DIR%/}/"
      

      # -----------------------
      # BUILD + RUN
      # -----------------------
      - name: Build & Run (DEV)
        env:
          SSH_HOST: "85.198.52.187"
          SSH_PASSWORD: "Amin#7Xv!92QpL4"
          SSH_PORT: "22"
          SSH_USER: "root"
          REMOTE_DIR: "/gym/front"
          PORT: "3000"
          IMAGE: gym-client:latest
          CONTAINER: gym-client
        run: |
          set -euo pipefail
          
          sshpass -p "$SSH_PASSWORD" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" <<EOF
          set -e
          cd "${REMOTE_DIR%/}"
          
          # -f removes a running container in one step and stays quiet on the first deploy.
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

          docker build -t "$IMAGE" .

          docker run -d \
            --name "$CONTAINER" \
            --env-file .env.production \
            --network shared-network \
            -p "127.0.0.1:${PORT}:${PORT}" \
            --restart unless-stopped \
            "$IMAGE"
          EOF


      - name: Cleanup lite folder on remote (optional)
        if: always()
        env:
          SSH_HOST: "85.198.52.187"
          SSH_PASSWORD: "Amin#7Xv!92QpL4"
          SSH_PORT: "22"
          SSH_USER: "root"
          REMOTE_DIR: "/gym/front"
        run: |
          set -euo pipefail
          sshpass -p "$SSH_PASSWORD" ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "rm -rf '${REMOTE_DIR%/}'"